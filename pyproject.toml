[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thalamus"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
  "nats-py",
  "httpx",
  "jsonschema",
  "pytest",
  "pytest-asyncio",
  "pydantic>=2,<3",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "schemas*", "protocol*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*"
]

[dependency-groups]
dev = [
    "pytest-cov==7.0.0",
    "testcontainers==4.14.2",
]
