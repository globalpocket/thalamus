[package]
name = "thalamus-bus"
version = "0.1.0"
edition = "2021"

[dependencies]
thalamus-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
