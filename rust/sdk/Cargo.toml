[package]
name = "thalamus-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
thalamus-protocol = { path = "../protocol" }
thalamus-bus = { path = "../bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
