[package]
name = "thalamus-runtime"
version = "0.1.1"
edition = "2021"

[dependencies]
thalamus-protocol = { path = "../protocol" }
thalamus-bus = { path = "../bus" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
